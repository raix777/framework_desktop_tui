[package]
name = "framework_desktop_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Library crate of the FrameworkComputer/framework-system repo
# (provides the EC access used by `framework_tool --rgbkbd ...`).
# `default-features = false` skips the USB/HID modules we don't use.
framework_lib = { version = "0.6.6", default-features = false }
